# Builds the Standard (CPU) variant when a version tag such as v0.1.0 is pushed, runs the
# tests and the smoke test of the built program, builds the installer and the portable
# zip, and attaches the files to a GitHub Release.
#
# The GPU variant is NOT built here: GitHub's runners have no NVIDIA GPU, so its GPU
# self-test cannot run. Build it locally with:  .\build_release.ps1 -WithGpu
#
# No secrets are used. The files are not code signed.
# Status: written for this project but not run yet (the project has no GitHub remote).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-standard:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup when the runner does not have it
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($paths | Where-Object { Test-Path $_ })) { choco install innosetup --no-progress -y }

      - name: Check that the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (python scripts/build_helpers.py version).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }

      - name: Build, test and package (Standard variant)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $python = (Get-Command python).Source
          ./build_release.ps1 -Python $python -BuildRoot "$env:RUNNER_TEMP\pqsse-build" -CopyTo "$env:GITHUB_WORKSPACE\release-out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}\pqsse-build\logs
          if-no-files-found: ignore

      - name: Upload the release files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pqsse-desktop-standard
          path: release-out/**

      - name: Attach the files to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/**/*
          body: |
            Standard (CPU) build. Not code signed: see docs/DISTRIBUTION.md.
            Check your download against SHA256SUMS.txt.
            The GPU build is not produced by this workflow.
