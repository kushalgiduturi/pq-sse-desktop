# Website only: when the site's sources change on master (text, styles, pages), check the committed
# build in site/public and deploy it to GitHub Pages. Releases deploy the site themselves
# (release.yml); this workflow is for changes between releases. No secrets.

name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "scripts/craft_check_site.py"
      - "scripts/check_site.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt pytest

      - name: The committed site matches its sources, and passes the checks
        run: |
          python -m pytest -q tests/test_m13_site.py -k "matches or craft or manifest_values"
          python scripts/check_site.py --no-browser

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
