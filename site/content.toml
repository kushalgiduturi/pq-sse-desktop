[footer]
line = "PQ-SSE Desktop is research and teaching software under the MIT License. It has not been audited: do not use it to protect real records."
privacy = "This site sets no cookies, runs no analytics and loads nothing from other sites."
links = [
  ["verify.html", "Verify a download"],
  ["security.html#report", "Report a problem"],
  ["third-party-licenses.txt", "Third-party licenses"],
  ["https://github.com/kushalgiduturi/pq-sse-desktop", "Source code"],
]

[home]
title = "PQ-SSE Desktop: search locked files without unlocking them"
hero = "Search locked files without unlocking them"
hero_text = "Alice keeps her documents in a cloud she does not trust. Bob and Carol may search some of them. The cloud stores everything, answers every search, and never sees a word. PQ-SSE Desktop lets you watch that happen on your own PC, step by step."
primary = "Download for Windows"
secondary = "How it works"
meta = "Free and open source. Windows 10 or 11, 64-bit. Version {version}, released {released}."

cast_title = "Who is in the story"
cast = [
  ["person", "Alice", "Owns the documents and holds the keys. She decides who may search what."],
  ["cloud", "The Cloud", "Rented storage. It keeps the locked documents and answers searches, but cannot read either."],
  ["person", "Bob and Carol", "Doctors. Each may search only the groups Alice approved, and can prove the answer is complete."],
]

shots_title = "What it looks like"
shots = [
  ["dark-stage", "The Stage in the dark theme: Alice, the Cloud and Bob, with the real stored bytes in the middle."],
  ["light-workspace-alice", "Alice's workspace in the light theme: her keys, her documents and who may search them."],
  ["dark-lab", "The Security Lab: each attack runs on a throwaway copy and shows the check that stops it."],
  ["light-inspector-search", "The step inspector: one real search, replayed at four levels of detail."],
]

facts_title = "What it is, plainly"
facts = [
  "Every step is the real protocol, not an animation of one: ten algorithms, from key setup to revoking a doctor.",
  "Keys are made with ML-KEM and documents are signed with ML-DSA, the post-quantum standards NIST published in 2024.",
  "Everything runs on your PC. The cloud part is a second program on the same machine; nothing is sent to the internet.",
  "It is research and teaching software. It has not been audited, and the post-quantum code is slow and not constant time.",
]
next_title = "Where to go next"
next = [
  ["download.html", "Download", "Pick the right file for your PC and check it."],
  ["install.html", "Install guide", "What Windows will ask, and why it warns about new software."],
  ["how-it-works.html", "How it works", "The ten algorithms in plain language."],
]

