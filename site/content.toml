[verify]
title = "Verify a download"
lede = "Check that a file you downloaded is exactly the one that was published. The checksum is computed here, in your browser. The file is never uploaded."
file_label = "Choose the downloaded file"
file_hint = "The file stays on your PC. Large files take a few seconds."
paste_label = "Or paste the SHA-256 that PowerShell printed"
paste_hint = "64 characters, letters a to f and digits. Capital or small letters do not matter."
check = "Check"
computing = "Computing the checksum of {name}..."
match = "This is {file}, version {version}, exactly as published."
match_name_differs = "The checksum is the one of {file}, version {version}. Your copy has a different name ({name}), which does not matter."
nomatch = "This checksum does not match any file of version {version}. Delete the file and download it again from the Download page."
bad_input = "That is not a SHA-256 checksum: it needs 64 characters, letters a to f and digits."
no_crypto = "This browser cannot compute checksums here (it needs a secure https page). Use PowerShell instead, as the install guide shows."
nojs = "This check needs JavaScript. Without it, use PowerShell and compare with the Download page, as the install guide shows."
compare_title = "The published checksums"

# ------------------------------------------------------------------ 404
[notfound]
title = "Page not found"
lede = "There is no page at this address. It may have moved."
home = "Go to the home page"
download = "Go to the download page"
