lede = "PQ-SSE Desktop is a Windows app that encrypts documents, lets the people you approve search them through a storage server that never sees the words, and checks that every answer is complete and unchanged. Its keys and signatures use the post-quantum standards ML-KEM and ML-DSA."
audience = "For students and teachers of cryptography, researchers reproducing the PQ-SSE paper, and anyone who wants to watch searchable encryption run. Not for protecting real records: it has not been audited."
