# ------------------------------------------------------------------ how it works
[how]
title = "How it works"
lede = "Ten algorithms, each one a real step you can run and replay in the app. The words below are the app's own plain-language layer; the step inspector shows the bytes."
algos = [
  ["1", "Setup", "The data owner, the cloud server and each receiver make their own key pairs: ML-KEM for sealed envelopes, ML-DSA for stamps. Private keys never leave the PC that made them."],
  ["2", "Join", "Receiver A asks to join with their public keys and a stamped request. The data owner approves them for some groups, and sends them those groups' keys in a sealed envelope only the receiver can open."],
  ["3", "BuildIndex", "The data owner locks each document with AES-256-GCM and builds a search index: for every word, a list of addresses that look random and point at locked entries."],
  ["4", "Update", "Adding or deleting documents appends new, stamped batches. Old searches cannot find new documents (forward privacy), and deleted ones stay hidden (backward privacy)."],
  ["5", "Publish", "The data owner stamps a short summary of each group: its version, how many entries, and a running fingerprint of everything in it. The cloud server keeps the newest one."],
  ["6", "TokenGen", "Receiver A turns a word into a sealed search slip: the addresses to look up, locked so that only the cloud server can read the slip and still not learn the word."],
  ["7", "Search", "The cloud server checks that Receiver A may search that group, looks up the addresses, and returns the locked entries with its own stamp. It never sees the word or the documents."],
  ["8", "Verify", "Receiver A checks the cloud server's answer against the data owner's stamped summary: nothing dropped, nothing changed, nothing replayed, and the summary is fresh."],
  ["9", "Decrypt", "Receiver A fetches a locked document and opens it with their group key, after checking the data owner's stamp on it."],
  ["10", "Revoke", "The data owner takes a receiver's access away by changing the locks of their groups and giving the new keys only to those who stay."],
]
shots = [
  ["dark-inspector-encrypt", "BuildIndex in the step inspector: readable text in, scrambled bytes out."],
  ["light-inspector-search", "Search in the step inspector: the Cloud returns two scrambled entries with its stamp."],
]
limits_title = "Honest limits"
limits = [
  ["Policy R or policy RE", "Revoking with policy R is quick: everything written after the change uses the new key. Documents from before it stay locked with the old key, which the revoked receiver still has; if the receiver teams up with the cloud server, the receiver can read those. Policy RE also locks every old document again with the new key and makes the cloud server delete the old copies. It closes that gap and takes longer. The Security Lab runs both and shows the difference."],
  ["What the GPU does", "The graphics chip only speeds up the symmetric batch work (computing many addresses and masks with SHA3) when a large index is built. ML-KEM and ML-DSA always run on the normal processor. At small sizes the GPU is not faster, and the app says so with measured numbers."],
  ["What the Cloud still learns", "Like every practical searchable encryption scheme, the Cloud sees which stored entries a search touches and when, and how many there are. It does not learn the word, the documents or the keys. The app shows exactly what the Cloud holds in its Cloud sees lens."],
  ["Not audited", "The code was reviewed only by its author; the review and the threat model are in the repository. The post-quantum code is OpenSSL's implementation of the NIST standards; the pure Python fallback is slow and not constant time. This is teaching and research software."],
]
paper = "The protocol and its terms are summarised in the project's concepts document."
paper_link = ["https://github.com/kushalgiduturi/pq-sse-desktop/blob/master/docs/concepts.md", "Read the concepts document"]

