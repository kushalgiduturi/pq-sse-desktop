# All text of the PQ-SSE Desktop website, in one place. scripts/build_site.py reads this file,
# the page templates in site/src/pages/ and latest.json, and writes site/public/.
# Versions, sizes, dates and hashes are never typed here: they come from latest.json.
# House rules: sentence case, no exclamation marks, no emoji, no long dashes.

[site]
name = "PQ-SSE Desktop"
tagline = "Search locked files without unlocking them"
description = "PQ-SSE Desktop shows how documents can stay encrypted in an untrusted cloud and still be searched, with post-quantum keys. Free, open source, for Windows."
skip = "Skip to the content"
menu = "Menu"
theme_to_light = "Switch to the light theme"
theme_to_dark = "Switch to the dark theme"
copy = "Copy"
copied = "Copied"
copy_failed = "Select the text and copy it"
download_short = "Download"

