# ------------------------------------------------------------------ how it works
[how]
title = "How it works"
lede = "Ten algorithms, each one a real step you can run and replay in the app. The words below are the app's own plain-language layer; the step inspector shows the bytes."
algos = [
  ["1", "Setup", "Alice, the Cloud and each doctor make their own key pairs: ML-KEM for sealed envelopes, ML-DSA for stamps. Private keys never leave the PC that made them."],
  ["2", "Join", "Bob asks to join with his public keys and a stamped request. Alice approves him for some groups, and sends him those groups' keys in a sealed envelope only he can open."],
  ["3", "BuildIndex", "Alice locks each document with AES-256-GCM and builds a search index: for every word, a list of addresses that look random and point at locked entries."],
  ["4", "Update", "Adding or deleting documents appends new, stamped batches. Old searches cannot find new documents (forward privacy), and deleted ones stay hidden (backward privacy)."],
  ["5", "Publish", "Alice stamps a short summary of each group: its version, how many entries, and a running fingerprint of everything in it. The Cloud keeps the newest one."],
  ["6", "TokenGen", "Bob turns a word into a sealed search slip: the addresses to look up, locked so that only the Cloud can read the slip and still not learn the word."],
  ["7", "Search", "The Cloud checks that Bob may search that group, looks up the addresses, and returns the locked entries with its own stamp. It never sees the word or the documents."],
  ["8", "Verify", "Bob checks the Cloud's answer against Alice's stamped summary: nothing dropped, nothing changed, nothing replayed, and the summary is fresh."],
  ["9", "Decrypt", "Bob fetches a locked document and opens it with his group key, after checking Alice's stamp on it."],
  ["10", "Revoke", "Alice takes a doctor's access away by changing the locks of his groups and giving the new keys only to those who stay."],
]
shots = [
  ["dark-inspector-encrypt", "BuildIndex in the step inspector: readable text in, scrambled bytes out."],
  ["light-inspector-search", "Search in the step inspector: the Cloud returns two scrambled entries with its stamp."],
]
limits_title = "Honest limits"
limits = [
  ["Policy R or policy RE", "Revoking with policy R is quick: everything written after the change uses the new key. Documents from before it stay locked with the old key, which the revoked doctor still has; if he teams up with the Cloud, he can read those. Policy RE also locks every old document again with the new key and makes the Cloud delete the old copies. It closes that gap and takes longer. The Security Lab runs both and shows the difference."],
  ["What the GPU does", "The graphics chip only speeds up the symmetric batch work (computing many addresses and masks with SHA3) when a large index is built. ML-KEM and ML-DSA always run on the normal processor. At small sizes the GPU is not faster, and the app says so with measured numbers."],
  ["What the Cloud still learns", "Like every practical searchable encryption scheme, the Cloud sees which stored entries a search touches and when, and how many there are. It does not learn the word, the documents or the keys. The app shows exactly what the Cloud holds in its Cloud sees lens."],
  ["Not audited", "The post-quantum code is a pure Python implementation of the NIST standards: slow and not constant time. This is teaching and research software."],
]
paper = "The protocol and its terms are summarised in the project's concepts document."
paper_link = ["https://github.com/kushalgiduturi/pq-sse-desktop/blob/master/docs/concepts.md", "Read the concepts document"]

# ------------------------------------------------------------------ security and privacy
[security]
title = "Security and privacy"
lede = "What PQ-SSE Desktop stores, what leaves your PC, and exactly what the checks on the downloads do and do not prove."
stores_title = "What the app stores, and where"
stores = [
  "Everything is in %LOCALAPPDATA%\\PQ-SSE-Desktop on your PC: settings, logs, the practice data and your own data.",
  "Private keys are stored encrypted with your passphrase. They are never written to a log and never shown.",
  "The cloud part is a second program on the same PC. Its database holds only locked documents and index entries; the smoke test scans it for plaintext on every build.",
]
leaves_title = "What leaves your PC"
leaves = [
  "Nothing, by itself. The app does not phone home, has no telemetry and sends no crash reports.",
  "Only what you start: a download from this site, or Check for updates in About, which reads the signed file list from this site once. You can hide that menu item in the settings.",
  "This website sets no cookies, runs no analytics and loads nothing from other sites. Fonts and pictures are served from here.",
]
trust_title = "How far you can trust a download"
trust = [
  ["What a checksum proves", "A SHA-256 checksum compared with the one on this site proves the file was not damaged or swapped on the way, as long as the checksum itself is genuine. If someone controlled both this site and the files, a matching checksum would prove nothing."],
  ["The signed file list", "The file list (latest.json) and every package carry a signature made with a private key that is not in the code repository: the maintainer keeps it, and the release workflow can use it only as an encrypted GitHub Actions secret. The web installer has the matching public key built in, and refuses a list or a file whose signature does not match. Someone who changes the files or the list without that key is caught; someone who steals the key is not."],
  ["Two places", "The checksums are published here and in the GitHub release notes. The site and the files are on different GitHub hosts, but GitHub runs both, so this is a weak second source."],
  ["Not code signed", "None of this is Windows code signing. Windows names the publisher as unknown and SmartScreen may warn. Code signing would add a publisher name that a certificate authority checked; it is not set up today."],
]
signing_title = "Code signing, researched"
signing = [
  ["Azure Artifact Signing", "Microsoft's signing service, about 9.99 US dollars a month. Microsoft answers from 2026 say individuals are accepted only in the USA and Canada. Not verified on an official eligibility page."],
  ["OV or EV certificate", "A certificate from a commercial authority, a few hundred US dollars a year, with the key on a hardware token or in a cloud store. Microsoft says EV no longer removes the SmartScreen warning at once. Prices not verified with sellers."],
  ["SignPath Foundation", "Free signing for open-source projects with a public repository and an OSI license; the certificate names SignPath Foundation as the publisher. Whether this project would be accepted is not verified."],
]
report_title = "Report a problem"
report = [
  "A security problem in the app or the website: open a private security advisory on GitHub (Security tab of the repository, Report a vulnerability). Please do not open a public issue for it.",
  "A false antivirus alert: check the checksum first, then report it to the antivirus maker (for Microsoft Defender: microsoft.com/wdsi/filesubmission) and, if you like, open an issue on GitHub so others know.",
]
report_link = ["https://github.com/kushalgiduturi/pq-sse-desktop/security", "Security page of the repository"]
licenses_title = "Third-party licenses"
licenses = "PQ-SSE Desktop is under the MIT License. It ships Qt for Python (LGPL 3), Python, cryptography, NumPy and other libraries, two fonts under the SIL Open Font License, and in the GPU build the NVIDIA CUDA runtime and NVRTC files that NVIDIA's license allows to be redistributed."
licenses_link = ["third-party-licenses.txt", "All third-party licenses"]

